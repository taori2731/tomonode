<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'self'; script-src 'self'; style-src 'self'; connect-src https://tomonode-account-api.rafaerunacaya27.workers.dev" />
    <title>パスワードを再設定 | TomoNode</title>
    <link rel="stylesheet" href="/password-reset.css" />
    <script src="/password-reset.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">TOMONODE</p>
      <h1>パスワードを再設定</h1>
      <p class="intro">新しいパスワードを入力してください。変更後は、すべての端末で再度サインインが必要になります。</p>

      <form id="reset-form" hidden>
        <label for="password">新しいパスワード</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="256" required />
        <p class="hint">15〜128文字（UTF-8で512バイト以内）</p>

        <label for="confirm-password">新しいパスワード（確認）</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="256" required />

        <button id="submit-button" type="submit">パスワードを更新</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite">確認しています…</p>
      <a class="home-link" href="/">TomoNode に戻る</a>
    </main>
  </body>
</html>
